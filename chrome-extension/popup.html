<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 16px;
    }
    h2 {
      font-size: 15px;
      color: #89b4fa;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .field { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 11px;
      color: #a6adc8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #45475a;
      border-radius: 8px;
      background: #313244;
      color: #cdd6f4;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #89b4fa; }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #313244;
    }
    .toggle-row span { font-size: 13px; }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #45475a;
      border-radius: 10px;
      transition: 0.3s;
    }
    .slider::before {
      content: '';
      position: absolute;
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background: #cdd6f4;
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle input:checked + .slider { background: #89b4fa; }
    .toggle input:checked + .slider::before { transform: translateX(16px); }
    .btn-row { display: flex; gap: 6px; margin-top: 12px; }
    .btn {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #89b4fa; color: #1e1e2e; }
    .btn-success { background: #a6e3a1; color: #1e1e2e; }
    .btn-warning { background: #f9e2af; color: #1e1e2e; }
    .btn-secondary { background: #45475a; color: #cdd6f4; }
    .shortcuts {
      margin-top: 12px;
      padding: 10px;
      background: #313244;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.6;
    }
    .shortcuts b { color: #89b4fa; }
    code {
      background: #45475a;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10px;
    }
    .status {
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      display: none;
    }
    .status.show { display: block; }
    .status.ok { background: rgba(166,227,161,0.15); color: #a6e3a1; }
    .status.err { background: rgba(243,139,168,0.15); color: #f38ba8; }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #6c7086;
    }
  </style>
</head>
<body>
  <h2>🎓 Study Helper</h2>

  <div class="field">
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIza... or AQ.Ab...">
  </div>

  <div class="toggle-row">
    <span>🟢 Extension Enabled</span>
    <label class="toggle">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>⚡ Auto-Solve on Quiz Page</span>
    <label class="toggle">
      <input type="checkbox" id="autoSolve">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>🎨 Bold Highlights</span>
    <label class="toggle">
      <input type="checkbox" id="boldStyle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="solveBtn">🎯 Solve Now</button>
    <button class="btn btn-warning" id="autoSelectBtn">🖱️ Auto-Click</button>
    <button class="btn btn-secondary" id="clearBtn">🧹 Clear</button>
  </div>

  <div class="status" id="status"></div>

  <div class="shortcuts">
    <b>Keyboard Shortcuts:</b><br>
    <code>Ctrl+Shift+S</code> Solve quiz<br>
    <code>Ctrl+Shift+A</code> Auto-click answers<br>
    <code>Ctrl+Shift+C</code> Clear highlights
  </div>

  <div class="footer">
    Lexyta Study Helper v1.0 by Pawas — Works on lms.lexyta.com
  </div>

  <script src="popup.js"></script>
</body>
</html>
